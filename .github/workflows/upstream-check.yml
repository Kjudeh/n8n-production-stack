name: Upstream version check

on:
  schedule:
    - cron: "0 9 * * 1" # Mondays 09:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check upstream tag and digest
        run: bash .github/scripts/upstream-check.sh

      - name: Open version-bump PR
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/upstream-bump
          title: "chore: bump pinned n8n image digest"
          commit-message: "chore: bump pinned n8n image digest"
          body: |
            Automated weekly pin refresh: latest stable n8n tag + digest.

            Review the n8n release notes (breaking changes between majors!),
            then run a from-scratch test deploy before merging
            (see CLAUDE.md §5 maintenance loop).
